project:
  root: .
  output_dir: artifacts/transaction/runs/transaction_ewcdr_calibrated_currentce_5epoch_seed42

protocol:
  stages: [base, task1, task2, task3, task4]
  tool_counts:
    base: 14175
    task1: 16557
    task2: 18930
    task3: 21291
    task4: 23639

data:
  target_id_field: target_tool_id
  decontamination:
    enabled: true
    preserve_original_eval: true
    match_source_id: true
    match_normalized_query: true
    query_normalization: strip_casefold_collapse_whitespace
    scope: all_stage_eval_splits
  base_train: toolhcl_links/transaction/base/raw/retrieval_train.json
  base_eval: toolhcl_links/transaction/base/raw/retrieval_eval.json
  base_tools: toolhcl_links/transaction/base/raw/train_tools_with_id.json
  task1_train: toolhcl_links/transaction/task1/raw/retrieval_train.json
  task1_eval: toolhcl_links/transaction/task1/raw/retrieval_eval.json
  task1_tools: toolhcl_links/transaction/task1/raw/toolret_task1_tools_with_id.json
  task2_train: toolhcl_links/transaction/task2/raw/retrieval_train.json
  task2_eval: toolhcl_links/transaction/task2/raw/retrieval_eval.json
  task2_tools: toolhcl_links/transaction/task2/raw/toolret_task2_tools_with_id.json
  task3_train: toolhcl_links/transaction/task3/raw/retrieval_train.json
  task3_eval: toolhcl_links/transaction/task3/raw/retrieval_eval.json
  task3_tools: toolhcl_links/transaction/task3/raw/toolret_task3_tools_with_id.json
  task4_train: toolhcl_links/transaction/task4/raw/retrieval_train.json
  task4_eval: toolhcl_links/transaction/task4/raw/retrieval_eval.json
  task4_tools: toolhcl_links/transaction/task4/raw/toolret_task4_tools_with_id.json

model:
  encoder_path: toolhcl_links/models/Meta-Llama-3-8B
  tokenizer_path: toolhcl_links/models/Meta-Llama-3-8B
  encoder_dtype: bfloat16
  load_direct_to_device: true
  max_length: 512
  hidden_size: 4096
  projection_hidden: 1024
  query_size: 384
  dropout: 0.1
  freeze_encoder: true

cache:
  enabled: true
  root: artifacts/transaction/cache_decontaminated_v6
  prepare_global_eval: true
  encoder_batch_size: 64
  length_bucketed: true
  shard_size: 4096
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2

training:
  stages: [base, task1, task2, task3, task4]
  classification_scope: current_stage_calibrated
  global_ce_weight: class_ratio
  checkpoint_selection: last_epoch
  stage_epochs:
    base: {min: 5, max: 5}
    task1: {min: 5, max: 5}
    task2: {min: 5, max: 5}
    task3: {min: 5, max: 5}
    task4: {min: 5, max: 5}
  validation:
    enabled: false
  early_stopping:
    window: 1
    patience: 1
    absolute_min_delta: 0.0
    relative_min_delta: 0.05
  batch_size: 256
  lr: 0.0003
  stage_lrs:
    base: 0.0003
    task1: 0.0003
    task2: 0.0003
    task3: 0.0003
    task4: 0.0003
  weight_decay: 0.01
  grad_clip: 1.0
  seed: 42
  log_every: 50
  max_train_samples: null
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2

importance:
  batch_size: 128
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2

ewcdr:
  method: ewc_dr
  lambda: 10000.0
  accumulation_mode: official_alpha
  importance_scope: all_visible
  importance_model_mode: train
  gamma: 1.0
  omega_max: 0.0001
  importance_max_samples: null
  importance_max_batches: null
  accumulation_device: cuda
  save_final_importance: false
  verify_unchanged: true

evaluation:
  checkpoint_dir: null
  stages: [base, task1, task2, task3, task4]
  batch_size: 512
  eval_limit: null
  topk: [1, 3, 5]
  filter_train_query_overlap: false
  precision: fp32
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2

runtime:
  device: cuda
  gpu: null
  use_amp: true
  precision: bf16
  resume: false
  smoke: false

smoke:
  train_samples_per_stage: 32
  importance_samples: 16
  eval_samples: 64
  batch_size: 4
