project:
  # Run commands from the repository root. Paths below are repository-relative.
  root: .
  output_dir: toolhcl_ewcdr_runs_pure

data:
  base_train: toolhcl_links/data/train/raw/retrieval_train.json
  base_eval: toolhcl_links/data/train/raw/retrieval_eval.json
  base_tools: toolhcl_links/data/train/raw/train_tools_with_id.json
  task1_train: toolhcl_links/data/task1/raw/retrieval_train.json
  task1_eval: toolhcl_links/data/task1/raw/retrieval_eval.json
  task1_tools: toolhcl_links/data/task1/raw/task1_tools_with_id.json
  task2_train: toolhcl_links/data/task2/raw/retrieval_train.json
  task2_eval: toolhcl_links/data/task2/raw/retrieval_eval.json
  task2_tools: toolhcl_links/data/task2/raw/task2_tools_with_id.json
  task3_train: toolhcl_links/data/task3/raw/retrieval_train.json
  task3_eval: toolhcl_links/data/task3/raw/retrieval_eval.json
  task3_tools: toolhcl_links/data/task3/raw/task3_tools_with_id.json

model:
  encoder_path: toolhcl_links/models/Meta-Llama-3-8B
  tokenizer_path: toolhcl_links/models/Meta-Llama-3-8B
  encoder_dtype: bfloat16
  load_direct_to_device: true
  max_length: 512
  hidden_size: 4096
  projection_hidden: 1024
  query_size: 384
  dropout: 0.1
  freeze_encoder: true

cache:
  enabled: true
  root: toolhcl_ewcdr_pure_cache
  encoder_batch_size: 64
  shard_size: 4096
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2

training:
  stages: [base, task1, task2, task3]
  stage_epochs:
    base: {min: 5, max: 30}
    task1: {min: 10, max: 30}
    task2: {min: 10, max: 30}
    task3: {min: 10, max: 30}
  early_stopping:
    window: 3
    patience: 3
    absolute_min_delta: 0.001
    relative_min_delta: 0.002
  batch_size: 256
  lr: 0.0003
  stage_lrs:
    base: 0.0003
    task1: 0.0003
    task2: 0.0003
    task3: 0.0003
  weight_decay: 0.01
  grad_clip: 1.0
  seed: 42
  log_every: 50
  max_train_samples: null
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2

importance:
  batch_size: 128
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2

ewcdr:
  method: ewc_dr
  lambda: 1000.0
  gamma: 1.0
  omega_max: 0.0001
  importance_max_samples: 10000
  importance_max_batches: null
  accumulation_device: cuda
  save_final_importance: false
  verify_unchanged: false

evaluation:
  checkpoint_dir: null
  stages: [base, task1, task2, task3]
  batch_size: 512
  eval_limit: null
  topk: [1, 3, 5]
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2

runtime:
  device: cuda
  gpu: null
  use_amp: true
  precision: bf16
  resume: false
  smoke: false

report:
  archived_comparison_dir: null

smoke:
  train_samples_per_stage: 32
  importance_samples: 16
  eval_samples: 64
  batch_size: 4
